apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: multi-agent-framework-ui
  namespace: multi-agent
  labels:
    app: multi-agent-framework-ui
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: ui.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: multi-agent-framework-ui
                port:
                  number: 80
