steps:
  # 1. Create .env file for Vite build-time configuration
  - name: 'bash'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'echo "VITE_API_BASE_URL=$_API_BASE_URL" > .env'
    id: 'Create .env file'

  # 2. Build the container image using BuildKit caching
  - name: 'gcr.io/cloud-builders/docker'
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME:latest'
      - '--cache-from'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME:latest'
      - '-f'
      - 'deployment/Dockerfile'
      - '.'
    id: 'Build Image'

  # 2. Push the container image to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA'
    id: 'Push Image with Commit SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME:latest'
    id: 'Push Image with Latest Tag'

  # 3. Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA'
      - '--region'
      - '$_REGION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '80'
    id: 'Deploy to Cloud Run'

# Options for build optimization
options:
  logging: CLOUD_LOGGING_ONLY

# Custom substitutions with reasonable defaults
substitutions:
  _SERVICE_NAME: 'ai-plt-ui'
  _REGION: 'us-central1'
  _REPOSITORY: 'cloud-run-source-deploy'
  _API_BASE_URL: 'https://ai-plt-be-git-24286129227.us-central1.run.app/api/v1'

images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA'
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME:latest'
